<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Student Profile - Lagos State University of Education Hostel</title>
  <link rel="icon" type="image/png" href="images/logo.jpg" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Shared Stylesheet -->
  <link href="css/style.css" rel="stylesheet" />
</head>

<body class="dash-body">

  <!-- 
       TOP BAR
       Do NOT change this. Same on every dashboard page.
  -->
  <header class="dash-topbar">
    <div class="dash-topbar-left">
      <!-- Brand -->
      <a href="studentdashboard.html" class="dash-brand">
        <div class="dash-brand-icon"><img src="images/logo.jpg" alt="School Logo" style="width:32px; height:32px; object-fit:contain;" /></div>
        <span>LASUED Hostel</span>
      </a>
    </div>
    <div class="dash-topbar-right">
      <!-- Notification Bell -->
      <button class="dash-icon-btn">
        <i class="bi bi-bell"></i>
      </button>
      <!-- User Profile -->
       <a href="profile.html" class="dash-user">
      <div class="dash-user">
        <div class="dash-avatar">FV</div>
        <span class="dash-username">Fiktor Vayo</span>
        <i class="bi bi-chevron-down" style="font-size:10px;"></i>
        </a>
      </div>
    </div>
  </header>
  <!-- END TOP BAR -->

  <div class="dash-layout">

    <!-- SIDEBAR -->
    <aside class="dash-sidebar">
      <nav class="dash-nav">

        <a href="studentdashboard.html" class="dash-nav-link active">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>
        <a href="rooms.html" class="dash-nav-link active">
          <i class="bi bi-door-open"></i>
          <span>Available Rooms</span>
        </a>
        <a href="#" class="dash-nav-link">
          <i class="bi bi-calendar-check"></i>
          <span>Room Booking</span>
        </a>
        <a href="#" class="dash-nav-link">
          <i class="bi bi-credit-card"></i>
          <span>Payment</span>
        </a>
        <a href="#" class="dash-nav-link">
          <i class="bi bi-chat-square-text"></i>
          <span>Complaints</span>
        </a>
        <a href="profile.html" class="dash-nav-link active">
          <i class="bi bi-person"></i>
          <span>Profile</span>
        </a>

        <div class="dash-nav-divider"></div>

        <a href="login.html" class="dash-nav-link dash-logout">
          <i class="bi bi-box-arrow-left"></i>
          <span>Logout</span>
        </a>

      </nav>
    </aside>
    <!-- END SIDEBAR -->


    <!-- MAIN CONTENT-->
    <main class="dash-main">

  <!-- Page Header -->
  <div class="dash-page-header">
    <div>
      <h4 class="dash-page-title">My Profile</h4>
      <p class="dash-page-sub">View and manage your personal information.</p>
    </div>
  </div>

  <div class="row g-4">

    <!-- Left Column — Std Profile -->
    <div class="col-md-4">
      <div class="dash-card">
        <div class="dash-card-body" style="text-align:center; padding:32px 24px;">
          
          <!-- Std Profile -->
          <div style="width:90px; height:90px; background:#e3f2fd; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;">
            <i class="bi bi-person-fill" style="font-size:40px; color:#1976d2;"></i>
          </div>

          <!-- Name -->
          <h5 style="font-size:16px; font-weight:700; color:#0d1757; margin-bottom:4px;">Fiktor Vayo</h5>
          <p style="font-size:12px; color:#888; margin-bottom:16px;">CS/2025/000</p>

          <!-- Status Badge -->
          <span class="badge-pending" style="margin-bottom:20px; display:inline-block;">Room Pending</span>

          <!-- Change Photo Button -->
          <button class="dash-btn-outline" style="width:100%; margin-top:8px;">
            <i class="bi bi-camera me-1"></i> Change Photo
          </button>

        </div>
      </div>
    </div>

    <!-- Right Column — Personal Details -->
    <div class="col-md-8">
      <div class="dash-card">
        <div class="dash-card-header">
          <span><i class="bi bi-person me-2" style="color:#1976d2;"></i>Personal Information</span>
          <button class="dash-btn-primary btn-sm" id="editBtn" onclick="toggleEdit()">
            <i class="bi bi-pencil me-1"></i> Edit Profile
          </button>
        </div>
        <div class="dash-card-body">
          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" value="Fiktor Vayo" disabled />
            </div>

            <div class="col-md-6">
              <label class="form-label">Matric Number</label>
              <input type="text" class="form-control" value="25120101000" disabled />
            </div>

            <div class="col-md-6">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" value="fiktor@gmail.com" disabled />
            </div>

            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input type="text" class="form-control" id="phone" value="234-9131010328" disabled />
            </div>

            <div class="col-md-6">
              <label class="form-label">Department</label>
              <input type="text" class="form-control" id="department" value="Computer Science" disabled />
            </div>

            <div class="col-md-6">
              <label class="form-label">Level</label>
              <input type="text" class="form-control" id="level" value="100 Level" disabled />
            </div>

            <div class="col-md-6">
              <label class="form-label">State of Origin</label>
              <input type="text" class="form-control" id="state" value="Lagos" disabled />
            </div>

            <div class="col-md-6">
              <label class="form-label">Room Allocated</label>
              <input type="text" class="form-control" value="Not Allocated" disabled />
            </div>

          </div>

          <!-- Save Button -->
          <div id="saveBtn" style="display:none; margin-top:20px; text-align:right;">
            <button onclick="toggleEdit()" class="dash-btn-outline me-2">Cancel</button>
            <button class="dash-btn-primary">
              <i class="bi bi-check-lg me-1"></i> Save Changes
            </button>
          </div>

        </div>
      </div>

      <!-- Change Password Column -->
      <div class="dash-card mt-4">
        <div class="dash-card-header">
          <span><i class="bi bi-lock me-2" style="color:#1976d2;"></i>Change Password</span>
        </div>
        <div class="dash-card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Current Password</label>
              <input type="password" class="form-control" placeholder="Enter current password" />
            </div>
            <div class="col-md-4">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control" placeholder="Enter new password" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" placeholder="Confirm new password" />
            </div>
            <div class="col-12 text-end">
              <button class="dash-btn-primary">
                <i class="bi bi-lock me-1"></i> Update Password
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</main>
    <!-- END MAIN CONTENT -->

  </div>
<!-- END LAYOUT WRAPPER -->


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>

  <script>
  function toggleEdit() {
    const inputs = document.querySelectorAll('#fullName, #email, #phone, #department, #level, #state');
    const saveBtn = document.getElementById('saveBtn');
    const editBtn = document.getElementById('editBtn');

    const isDisabled = inputs[0].disabled;

    inputs.forEach(input => {
      input.disabled = !isDisabled;
    });

    if (isDisabled) {
      saveBtn.style.display = 'block';
      editBtn.innerHTML = '<i class="bi bi-x me-1"></i> Cancel Edit';
    } else {
      saveBtn.style.display = 'none';
      editBtn.innerHTML = '<i class="bi bi-pencil me-1"></i> Edit Profile';
    }
  }
</script>
</body>
</html>
